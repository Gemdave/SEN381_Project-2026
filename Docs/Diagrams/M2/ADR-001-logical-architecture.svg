<svg width="900" height="610" viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CivicConnect logical architecture</title>
<desc>Layered modular-monolith architecture: two browser clients call into a single ASP.NET Core application containing a presentation layer, an authorization policy, an application services layer, and a data access layer, which reads and writes an external PostgreSQL database.</desc>
