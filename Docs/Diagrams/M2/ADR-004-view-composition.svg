<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540">
<title>ADR-004 role based view composition</title>
<desc>Role specific page models compose shared presentation partials and receive a capability object built on the server from the authorisation policy. Capabilities decide rendering only; each handler asks the policy again before acting.</desc>
<rect x="0" y="0" width="900" height="540" fill="#ffffff" />
<text x="20" y="32" font-family="Segoe UI, system-ui, sans-serif" font-size="17" fill="#1f3864" text-anchor="start" font-weight="700" font-style="normal">ADR-004: role based view composition</text>
<text x="20" y="52" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#5b6672" text-anchor="start" font-weight="normal" font-style="normal">CivicConnect, ASP.NET Core Razor Pages. Design pattern decision 1 of 2.</text>
<rect x="370" y="72" width="160" height="38" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5" />
<text x="450" y="96" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Browser</text>
<rect x="20" y="132" width="540" height="144" rx="8" fill="#f4f6fa" stroke="#c9d2e0" stroke-width="1" />
<text x="34" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="start" font-weight="600" font-style="normal">CONTAINERS: ONE PAGE MODEL PER ROLE</text>
<rect x="36" y="162" width="248" height="50" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5" />
<text x="160" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Pages/Requests</text>
<text x="160" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">Submit, Index, Details (read only status)</text>
<rect x="296" y="162" width="248" height="50" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5" />
<text x="420" y="186" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Pages/Staff</text>
<text x="420" y="204" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">Queue, Details (accept, status)</text>
<rect x="36" y="218" width="248" height="46" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5" stroke-dasharray="5 4" />
<text x="160" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Pages/Management</text>
<text x="160" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">not built at M2</text>
<rect x="296" y="218" width="248" height="46" rx="6" fill="#ffffff" stroke="#1f3864" stroke-width="1.5" stroke-dasharray="5 4" />
<text x="420" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">Pages/Admin</text>
<text x="420" y="260" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">not built at M2</text>
<rect x="20" y="306" width="540" height="156" rx="8" fill="#f4f6fa" stroke="#c9d2e0" stroke-width="1" />
<text x="34" y="326" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="start" font-weight="600" font-style="normal">PRESENTATION: SHARED AND ROLE BLIND</text>
<rect x="36" y="336" width="248" height="46" rx="6" fill="#eef2f7" stroke="#1f3864" stroke-width="1.5" />
<text x="160" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">_RequestSummary</text>
<text x="160" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">one row in a list</text>
<rect x="296" y="336" width="248" height="46" rx="6" fill="#eef2f7" stroke="#1f3864" stroke-width="1.5" />
<text x="420" y="360" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">_RequestFields</text>
<text x="420" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">fields, no controls</text>
<rect x="36" y="392" width="160" height="46" rx="6" fill="#eef2f7" stroke="#1f3864" stroke-width="1.5" />
<text x="116" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">_HistoryList</text>
<text x="116" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">recorded actions</text>
<rect x="204" y="392" width="160" height="46" rx="6" fill="#eef2f7" stroke="#1f3864" stroke-width="1.5" />
<text x="284" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">_EmptyState</text>
<text x="284" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">nothing to show</text>
<rect x="372" y="392" width="172" height="46" rx="6" fill="#eef2f7" stroke="#1f3864" stroke-width="1.5" />
<text x="458" y="416" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">status-badge</text>
<text x="458" y="434" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">tag helper</text>
<rect x="592" y="132" width="288" height="128" rx="6" fill="#e8f0e9" stroke="#2f6b3a" stroke-width="1.5" />
<text x="736" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">RequestCapabilities</text>
<text x="736" y="180" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">CanAccept</text>
<text x="736" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">CanTransition, NextStatuses</text>
<text x="736" y="216" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">CanSeeInternals</text>
<text x="736" y="242" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2f6b3a" text-anchor="middle" font-weight="normal" font-style="italic">built by CapabilityFactory</text>
<rect x="592" y="306" width="288" height="120" rx="6" fill="#e8f0e9" stroke="#2f6b3a" stroke-width="1.5" />
<text x="736" y="332" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#1f2933" text-anchor="middle" font-weight="600" font-style="normal">AuthorisationPolicy</text>
<text x="736" y="352" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">ADR-005</text>
<text x="736" y="374" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">permissions and ownership,</text>
<text x="736" y="390" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="middle" font-weight="normal" font-style="normal">refuses by default</text>
<text x="736" y="412" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2f6b3a" text-anchor="middle" font-weight="normal" font-style="italic">asked again by every handler</text>
<line x1="450" y1="110" x2="450" y2="121" stroke="#1f3864" stroke-width="1.6" />
<polygon points="450,130 445.95,121 454.05,121" fill="#1f3864" />
<line x1="290" y1="276" x2="290" y2="295" stroke="#1f3864" stroke-width="1.6" />
<polygon points="290,304 285.95,295 294.05,295" fill="#1f3864" />
<text x="300" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#1f3864" text-anchor="start" font-weight="normal" font-style="normal">compose</text>
<line x1="590" y1="146" x2="479" y2="146" stroke="#2f6b3a" stroke-width="1.6" stroke-dasharray="5 3" />
<polygon points="470,146 479,141.95 479,150.05" fill="#2f6b3a" />
<text x="586" y="136" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2f6b3a" text-anchor="end" font-weight="normal" font-style="normal">capabilities to the page model</text>
<line x1="736" y1="304" x2="736" y2="273" stroke="#2f6b3a" stroke-width="1.6" stroke-dasharray="5 3" />
<polygon points="736,264 740.05,273 731.95,273" fill="#2f6b3a" />
<text x="726" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2f6b3a" text-anchor="end" font-weight="normal" font-style="normal">same permissions the services enforce</text>
<text x="20" y="492" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="start" font-weight="normal" font-style="normal">Solid arrow: request and composition.</text>
<text x="20" y="508" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#2f6b3a" text-anchor="start" font-weight="normal" font-style="normal">Dashed green: capabilities. They decide what is drawn. They never decide whether an action is allowed.</text>
<text x="20" y="524" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5b6672" text-anchor="start" font-weight="normal" font-style="normal">Dashed box: role kept out of scope for Milestone 2.</text>
</svg>
