<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>CivicConnect deployment view</title>
<desc>Physical deployment: a developer pushes to GitHub, GitHub Actions builds and tests the container image and deploys it to Render, which hosts the CivicConnect application on its free tier; browsers reach it over HTTPS; the application connects over TLS to a separate managed PostgreSQL database hosted on Neon.</desc>
<rect x="0" y="0" width="900" height="580" fill="white"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="40" y="20" width="220" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="150.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Developer workstation</text>

<rect x="300" y="20" width="220" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="410.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">GitHub repository (main)</text>

<line x1="260" y1="45" x2="298" y2="45" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="262" y="35" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444441">git push</text>

<rect x="300" y="110" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
<text x="410.0" y="129.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">GitHub Actions</text>
<text x="410.0" y="149.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#2C2C2A">Build &amp; test (CI)</text>

<line x1="410" y1="70" x2="410" y2="108" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="560" y="20" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="630.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#0C447C">Requester</text>

<rect x="720" y="20" width="140" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="790.0" y="42.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#0C447C">Staff / admin</text>

<rect x="560" y="210" width="300" height="140" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5,4"/>
<text x="710.0" y="280.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="None"></text>

<text x="580" y="232" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Render – free tier</text>
<text x="580" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#2C2C2A">Docker container, spins down when idle</text>

<rect x="580" y="260" width="260" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="710.0" y="281.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#085041">CivicConnect app</text>
<text x="710.0" y="301.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#085041">ASP.NET Core, HTTPS via Render (ADR-007)</text>

<path d="M 410 166 L 410 190 L 570 190 L 570 208" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="418" y="182" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444441">Deploy on merge to main</text>

<line x1="630" y1="64" x2="630" y2="208" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="638" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444441">HTTPS</text>

<line x1="790" y1="64" x2="790" y2="208" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="798" y="140" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444441">HTTPS</text>

<rect x="560" y="400" width="300" height="130" rx="16" fill="none" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="5,4"/>
<text x="710.0" y="465.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="None"></text>

<text x="580" y="422" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Neon – free plan</text>
<text x="580" y="439" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#2C2C2A">Managed PostgreSQL, persistent (no expiry)</text>

<rect x="600" y="445" width="220" height="55" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="710.0" y="472.5" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#712B13">PostgreSQL 17.x</text>

<line x1="710" y1="350" x2="710" y2="398" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="718" y="375" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#444441">Npgsql / TLS – env var</text>

</svg>